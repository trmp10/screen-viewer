<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Screen Viewer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='3' width='20' height='13' rx='2'/><path d='M1 21h22'/><path d='M8 21l1-5h6l1 5'/></svg>" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: rgb(83, 83, 83);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: #000;
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #555;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .header-title svg {
      flex-shrink: 0;
      opacity: 0.6;
    }

    .url-input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 580px;
      margin: 0 auto;
    }

    .url-input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 6px;
      color: #fff;
      font-size: 16px;
      height: 40px;
      padding: 0 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    .url-input:focus { border-color: #555; }
    .url-input::placeholder { color: #444; }

    .header-btn {
      height: 30px;
      padding: 0 10px;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 6px;
      color: #888;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.1s;
    }

    .header-btn:hover { background: #2a2a2a; color: #ccc; border-color: #444; }

    .header-icon-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 6px;
      color: #888;
      cursor: pointer;
      transition: all 0.1s;
      flex-shrink: 0;
    }

    .header-icon-btn:hover { background: #2a2a2a; color: #ccc; border-color: #444; }
    .header-icon-btn:disabled { opacity: 0.3; cursor: default; pointer-events: none; }

    /* Title dropdown */
    .title-wrap {
      position: relative;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .title-caret {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: #555;
      cursor: pointer;
      transition: color 0.1s, background 0.1s;
      padding: 0;
    }

    .title-caret:hover { color: #aaa; background: #1e1e1e; }

    .title-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      background: #161616;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      padding: 6px;
      min-width: 160px;
      z-index: 300;
    }

    .title-wrap.open .title-dropdown { display: block; }

    .title-menu-item {
      display: flex;
      align-items: center;
      padding: 7px 10px;
      border-radius: 5px;
      cursor: pointer;
      color: #aaa;
      font-size: 13px;
      white-space: nowrap;
      transition: background 0.1s, color 0.1s;
    }

    .title-menu-item:hover { background: #222; color: #fff; }

    /* Bookmarks */
    .bookmark-wrap {
      position: relative;
    }

    .bookmark-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: #161616;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      padding: 6px;
      min-width: 260px;
      z-index: 300;
    }

    .bookmark-wrap.open .bookmark-dropdown { display: block; }

    .bookmark-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 5px;
      cursor: pointer;
      color: #aaa;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bookmark-item:hover { background: #222; color: #fff; }

    .bookmark-item-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bookmark-del {
      opacity: 0;
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 14px;
      padding: 0 2px;
      line-height: 1;
    }

    .bookmark-item:hover .bookmark-del { opacity: 1; }
    .bookmark-del:hover { color: #f66; }

    .bookmark-add-row {
      display: flex;
      gap: 6px;
      padding: 6px 4px 2px;
      border-top: 1px solid #222;
      margin-top: 4px;
    }

    .bookmark-input {
      flex: 1;
      background: #0e0e0e;
      border: 1px solid #2e2e2e;
      border-radius: 5px;
      color: #eee;
      font-size: 12px;
      padding: 5px 8px;
      outline: none;
    }

    .bookmark-input:focus { border-color: #484848; }

    .bookmark-save-btn {
      height: 28px;
      padding: 0 10px;
      background: #222;
      border: 1px solid #2e2e2e;
      border-radius: 5px;
      color: #aaa;
      font-size: 12px;
      cursor: pointer;
    }

    .bookmark-save-btn:hover { background: #2a2a2a; color: #fff; }

    /* Tabs */
    .url-tabs-bar {
      background: #0d0d0d;
      height: 38px !important;
    }

    .tabs-bar {
      background: #111;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      padding: 0 8px;
      height: 46px;
      flex-shrink: 0;
      gap: 3px;
      overflow-x: auto;
    }

    .tabs-bar::-webkit-scrollbar { height: 2px; }
    .tabs-bar::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px 0 10px;
      height: 32px;
      border-radius: 5px;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid transparent;
      font-size: 14px;
      color: #666;
      transition: all 0.1s;
      flex-shrink: 0;
      user-select: none;
    }

    .tab:hover { background: #1e1e1e; color: #aaa; }

    .tab.active {
      background: #2a2a2a;
      border-color: #363636;
      color: #fff;
    }

    .tab-name { font-weight: 500; }
    .tab-dims { color: #555; font-size: 11px; }
    .tab.active .tab-dims { color: #777; }

    .tab-close {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: none;
      background: transparent;
      color: #444;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      padding: 0;
      line-height: 1;
      transition: all 0.1s;
    }

    .tab-close:hover { background: #444; color: #fff; }

    .tab-add {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 5px;
      border: 1px dashed #2e2e2e;
      background: transparent;
      color: #444;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      transition: all 0.1s;
      flex-shrink: 0;
    }

    .tab-add:hover { border-color: #555; color: #aaa; background: #1e1e1e; }

    /* Main */
    .main {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 28px 24px;
    }

    .main::-webkit-scrollbar { width: 0; height: 0; }

    .view-wrap {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
    }


    .view-frame {
      display: block;
      position: relative;
      box-shadow: 0 4px 30px rgba(0,0,0,0.7);
    }

    .nav-arrow {
      display: none;
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 50%;
      color: #fff;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      z-index: 100;
      transition: background 0.15s;
      user-select: none;
    }

    .nav-arrow:hover { background: rgba(255,255,255,0.22); }
    body.app-fullscreen .nav-arrow { display: flex; }
    .nav-prev { left: 20px; }
    .nav-next { right: 20px; }

    body.app-fullscreen .header,
    body.app-fullscreen .tabs-bar,
    body.app-fullscreen .url-tabs-bar,
    body.app-fullscreen .zoom-card { display: none; }

    .fs-actions {
      display: none;
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-60px);
      z-index: 500;
      background: rgba(20,20,20,0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 6px 8px;
      gap: 4px;
      flex-direction: row;
      transition: transform 0.2s ease, opacity 0.2s ease;
      opacity: 0;
    }
    body.app-fullscreen .fs-actions { display: flex; }
    body.app-fullscreen .fs-actions.fs-visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .fs-hover-zone {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      z-index: 499;
    }
    body.app-fullscreen .fs-hover-zone { display: block; }

    body.app-fullscreen .main {
      padding: 0;
      background: #000;
      align-items: center;
      justify-content: center;
    }



    /* Empty */
    .empty {
      color: #555;
      font-size: 13px;
      text-align: center;
      padding-top: 80px;
      line-height: 1.8;
    }

    /* Update modal */
    .update-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 600;
    }

    .update-overlay.hidden { display: none; }

    .update-modal {
      background: #161616;
      border: 1px solid #2e2e2e;
      border-radius: 12px;
      padding: 28px 24px 20px;
      width: 300px;
      text-align: center;
    }

    .update-modal-icon {
      font-size: 28px;
      margin-bottom: 12px;
      line-height: 1;
    }

    .update-modal-title {
      color: #eee;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .update-modal-sub {
      color: #666;
      font-size: 12px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .update-modal-close {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #2e2e2e;
      background: #222;
      color: #aaa;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }

    .update-modal-close:hover { background: #2a2a2a; color: #fff; }
    .update-modal-close.hidden { display: none; }

    .update-modal-install {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.1s;
    }
    .update-modal-install:hover { background: #1d4ed8; }
    .update-modal-install.hidden { display: none; }

    /* Modal */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .overlay.hidden { display: none; }

    .modal {
      background: #161616;
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      padding: 20px;
      width: 268px;
    }

    .modal h3 {
      color: #eee;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .field { margin-bottom: 12px; }

    .field label {
      display: block;
      color: #666;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      background: #0e0e0e;
      border: 1px solid #2e2e2e;
      border-radius: 5px;
      color: #eee;
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.1s;
    }

    .field input:focus { border-color: #484848; }

    .field-row { display: flex; gap: 8px; }
    .field-row .field { flex: 1; }

    .modal-actions { display: flex; gap: 8px; margin-top: 16px; }

    .btn {
      flex: 1;
      padding: 8px;
      border-radius: 5px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.1s;
    }

    .btn:hover { opacity: 0.8; }
    .btn-primary { background: #fff; color: #000; }
    .btn-secondary { background: #222; color: #888; border: 1px solid #2e2e2e; }

    /* Inspect */
    .header-icon-btn.active {
      background: #2a2a2a;
      border-color: #4a9eff;
      color: #4a9eff;
    }

    .inspect-panel {
      display: none;
      position: fixed;
      top: 110px;
      right: 16px;
      width: 236px;
      background: #161616;
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      overflow: hidden;
      z-index: 500;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .inspect-panel.visible { display: flex; }

    .inspect-panel.panel-collapsed {
      transform: translateX(calc(100% - 32px));
    }

    .inspect-collapse-tab {
      width: 32px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      border-right: 1px solid #2e2e2e;
      color: #555;
      cursor: pointer;
      transition: color 0.1s, background 0.1s;
      padding: 0;
    }

    .inspect-collapse-tab:hover { color: #ddd; background: rgba(255,255,255,0.04); }

    .inspect-content {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      min-width: 0;
    }

    .inspect-content::-webkit-scrollbar { width: 0; }

    .inspect-tag {
      color: #4a9eff;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .inspect-field {
      margin-bottom: 10px;
    }

    .inspect-field label {
      display: block;
      color: #999;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 4px;
    }

    .inspect-field input {
      width: 100%;
      background: #0e0e0e;
      border: 1px solid #2e2e2e;
      border-radius: 5px;
      color: #eee;
      font-size: 13px;
      padding: 6px 8px;
      outline: none;
      transition: border-color 0.1s;
    }

    .inspect-field input:focus { border-color: #484848; }

    .inspect-pad-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 8px;
    }

    .inspect-toggle {
      width: 32px;
      height: 18px;
      border-radius: 9px;
      border: none;
      background: #333;
      cursor: pointer;
      position: relative;
      padding: 0;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .inspect-toggle.on { background: #4a9eff; }

    .inspect-toggle-knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s;
      display: block;
    }

    .inspect-toggle.on .inspect-toggle-knob { transform: translateX(14px); }

    .inspect-hint {
      color: #444;
      font-size: 11px;
      text-align: center;
      padding: 8px 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-wrap" id="titleWrap">
      <span class="header-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="13" rx="2"/>
          <path d="M1 21h22"/>
          <path d="M8 21l1-5h6l1 5"/>
        </svg>
        Screen Viewer
      </span>
      <button class="title-caret" id="titleCaretBtn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div class="title-dropdown">
        <div class="title-menu-item" id="releaseBtn">Update</div>
      </div>
    </div>
    <div class="url-input-wrap">
      <div class="bookmark-wrap" id="bookmarkWrap">
        <button class="header-icon-btn" id="bookmarkBtn" title="Bookmarks">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
          </svg>
        </button>
        <div class="bookmark-dropdown" id="bookmarkDropdown">
          <div id="bookmarkList"></div>
          <div class="bookmark-add-row">
            <input class="bookmark-input" id="bookmarkInput" placeholder="Add current URL…" />
            <button class="bookmark-save-btn" id="bookmarkSaveBtn">Save</button>
          </div>
        </div>
      </div>
      <button class="header-icon-btn" id="backBtn" title="Back" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <button class="header-icon-btn" id="forwardBtn" title="Forward" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
      <input class="url-input" id="urlInput" type="text" placeholder="http://localhost:3000" spellcheck="false" autocomplete="off" />
      <button class="header-icon-btn" id="refreshBtn" title="Refresh">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
      </button>
      <button class="header-icon-btn" id="inspectBtn" title="Inspect element">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="8 6 2 12 8 18"/>
          <polyline points="16 6 22 12 16 18"/>
          <line x1="15" y1="6" x2="9" y2="18"/>
        </svg>
      </button>
    </div>
    <div style="display:flex;gap:8px;flex-shrink:0;">
    <button class="header-icon-btn" id="screenshotBtn" title="Screenshot">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </button>
    <button class="header-icon-btn" id="fullscreenBtn" title="Fullscreen">
      <svg id="fsIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
        <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
      </svg>
    </button>
    </div>
  </div>

  <div class="tabs-bar" id="tabsBar">
    <button class="tab-add" id="addTabBtn" title="Add screen">+</button>
  </div>

  <div class="tabs-bar url-tabs-bar" id="urlTabsBar">
    <button class="tab-add" id="addUrlTabBtn" title="Add URL tab">+</button>
  </div>

  <div class="main" id="main"></div>

  <div class="fs-hover-zone" id="fsHoverZone"></div>
  <div class="fs-actions" id="fsActions">
    <button class="header-icon-btn" id="fsScreenshotBtn" title="Screenshot">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </button>
    <button class="header-icon-btn" id="fsInspectBtn" title="Inspect element">

<div class="update-overlay hidden" id="updateOverlay">

<div class="overlay hidden" id="overlay">
    <div class="modal">
      <h3>Add Screen</h3>
      <div class="field">
        <label>Name</label>
        <input id="mName" type="text" placeholder="e.g. FHD" />
      </div>
      <div class="field-row">
        <div class="field">
          <label>Width</label>
          <input id="mWidth" type="number" placeholder="1920" />
        </div>
        <div class="field">
          <label>Height</label>
          <input id="mHeight" type="number" placeholder="1080" />
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" id="confirmBtn">Add</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULTS = [
      { name: 'FHD', width: 1920, height: 1080 },
      { name: 'MacBook 14"', width: 1440, height: 900 },
      { name: 'HD', width: 1366, height: 768 },
      { name: 'MacBook Air', width: 1280, height: 800 },
    ];

    let refs = {};
    let viewEls = [];

    let state = (() => {
      try {
        const s = JSON.parse(localStorage.getItem('sv')) || null;
        if (!s) return null;
        if (s.url !== undefined && !s.urls) {
          return { urls: s.url ? [s.url] : [], activeUrl: 0, active: s.active || 0, views: s.views || DEFAULTS };
        }
        return s;
      } catch { return null; }
    })() || { urls: [], activeUrl: 0, active: 3, views: DEFAULTS };

    const $ = id => document.getElementById(id);
    const urlInput = $('urlInput');
    const tabsBar = $('tabsBar');
    const addTabBtn = $('addTabBtn');
    const main = $('main');
    const overlay = $('overlay');
    const mName = $('mName');
    const mWidth = $('mWidth');
    const mHeight = $('mHeight');

    urlInput.value = state.urls[state.activeUrl] || '';

    function save() {
      localStorage.setItem('sv', JSON.stringify(state));
    }

    function urlLabel(url) {
      try { const h = new URL(url).host; return h || url; } catch { return url || 'New tab'; }
    }

    function render() {
      renderTabs();
      renderUrlTabs();
      renderView();
    }

    const urlTabsBar = $('urlTabsBar');
    const addUrlTabBtn = $('addUrlTabBtn');

    function renderUrlTabs() {
      urlTabsBar.querySelectorAll('.tab').forEach(t => t.remove());
      state.urls.forEach((url, i) => {
        const tab = document.createElement('div');
        tab.className = 'tab' + (i === state.activeUrl ? ' active' : '');
        const name = document.createElement('span');
        name.className = 'tab-name';
        name.textContent = urlLabel(url);
        const close = document.createElement('button');
        close.className = 'tab-close';
        close.textContent = '×';
        close.onclick = e => { e.stopPropagation(); removeUrlTab(i); };
        tab.append(name, close);
        tab.onclick = () => switchUrl(i);
        urlTabsBar.insertBefore(tab, addUrlTabBtn);
      });
    }

    function switchUrl(i) {
      state.activeUrl = i;
      urlInput.value = state.urls[i] || '';
      save();
      renderUrlTabs();
      renderView();
    }

    function removeUrlTab(i) {
      if (viewEls[i]) {
        viewEls[i].forEach(el => { if (el) el.wrap.remove(); });
        viewEls.splice(i, 1);
      }
      state.urls.splice(i, 1);
      if (state.activeUrl >= state.urls.length) state.activeUrl = Math.max(0, state.urls.length - 1);
      urlInput.value = state.urls[state.activeUrl] || '';
      save();
      render();
    }

    addUrlTabBtn.onclick = () => {
      state.urls.push('');
      state.activeUrl = state.urls.length - 1;
      save();
      render();
      urlInput.value = '';
      urlInput.focus();
    };

    function renderTabs() {
      tabsBar.querySelectorAll('.tab').forEach(t => t.remove());
      state.views.forEach((v, i) => {
        const tab = document.createElement('div');
        tab.className = 'tab' + (i === state.active ? ' active' : '');

        const name = document.createElement('span');
        name.className = 'tab-name';
        name.textContent = v.name;

        const dims = document.createElement('span');
        dims.className = 'tab-dims';
        dims.textContent = v.width + 'x' + v.height;

        const close = document.createElement('button');
        close.className = 'tab-close';
        close.textContent = '×';
        close.onclick = e => { e.stopPropagation(); removeView(i); };

        const sep = document.createElement('span');
        sep.textContent = '·';
        sep.style.cssText = 'color:#333;font-size:10px;';
        tab.append(name, sep, dims, close);
        tab.onclick = () => { state.active = i; save(); render(); };
        tabsBar.insertBefore(tab, addTabBtn);
      });
    }

    function renderView() {
      const activeUrl = state.urls[state.activeUrl];

      if (!state.urls[state.activeUrl]s.length || !activeUrl) {
        main.innerHTML = '<div class="empty">Add a URL tab above and enter a URL</div>';
        refs = {};
        return;
      }

      if (!state.views.length) {
        main.innerHTML = '<div class="empty">No screens. Click + to add one.</div>';
        refs = {};
        return;
      }

      if (main.querySelector('.empty')) {
        main.innerHTML = '';
      }

      while (viewEls.length < state.urls.length) viewEls.push([]);

      state.urls.forEach((url, ui) => {
        if (!url) return;
        if (!viewEls[ui]) viewEls[ui] = [];
        state.views.forEach((v, si) => {
          if (viewEls[ui][si]) return;

          const zoom = fitZoom(v);
          const wrap = document.createElement('div');
          wrap.className = 'view-wrap';

          const frame = document.createElement('div');
          frame.className = 'view-frame';

          const scaleWrap = document.createElement('div');
          scaleWrap.style.width = v.width * zoom + 'px';
          scaleWrap.style.height = v.height * zoom + 'px';
          scaleWrap.style.overflow = 'hidden';
          scaleWrap.style.position = 'relative';

          const webview = document.createElement('webview');
          webview.src = url;
          webview.style.width = v.width + 'px';
          webview.style.height = v.height + 'px';
          webview.style.transformOrigin = '0 0';
          webview.style.transform = `scale(${zoom})`;
          webview.style.display = 'inline-flex';

          webview.addEventListener('did-navigate', e => {
            if (ui === state.activeUrl) {
              state.urls[ui] = e.url;
              urlInput.value = e.url;
              renderUrlTabs();
              save();
              updateNavButtons();
            }
          });
          webview.addEventListener('did-navigate-in-page', e => {
            if (e.isMainFrame && ui === state.activeUrl) {
              state.urls[ui] = e.url;
              urlInput.value = e.url;
              renderUrlTabs();
              save();
              updateNavButtons();
            }
          });

          scaleWrap.appendChild(webview);
          frame.appendChild(scaleWrap);

          const prevBtn = document.createElement('button');
          prevBtn.className = 'nav-arrow nav-prev';
          prevBtn.innerHTML = '&#8249;';
          prevBtn.onclick = () => switchScreen(state.active - 1);

          const nextBtn = document.createElement('button');
          nextBtn.className = 'nav-arrow nav-next';
          nextBtn.innerHTML = '&#8250;';
          nextBtn.onclick = () => switchScreen(state.active + 1);

          frame.append(prevBtn, nextBtn);
          wrap.append(frame);
          main.appendChild(wrap);

          viewEls[ui][si] = { wrap, scaleWrap, webview };
        });
      });

      viewEls.forEach((urlViews, ui) => {
        (urlViews || []).forEach((el, si) => {
          if (el) el.wrap.style.display = (ui === state.activeUrl && si === state.active) ? '' : 'none';
        });
      });

      refs = (viewEls[state.activeUrl] || [])[state.active] || {};
      updateNavButtons();
    }

    function switchScreen(i) {
      if (i < 0 || i >= state.views.length) return;
      state.active = i;
      save();
      renderView();
      renderTabs();
      if (isFullscreen) setTimeout(() => applyFullscreenScale(state.views[i]), 50);
    }

    function removeView(i) {
      viewEls.forEach(urlViews => {
        if (urlViews && urlViews[i]) { urlViews[i].wrap.remove(); urlViews.splice(i, 1); }
      });
      state.views.splice(i, 1);
      if (state.active >= state.views.length) state.active = Math.max(0, state.views.length - 1);
      save();
      render();
    }

    // URL
    urlInput.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      let val = urlInput.value.trim();
      if (val && !/^https?:\/\//i.test(val)) val = 'http://' + val;
      urlInput.value = val;
      if (!state.urls[state.activeUrl]s.length) { state.urls.push(val); state.activeUrl = 0; }
      else { state.urls[state.activeUrl] = val; }
      save();
      const urlViews = viewEls[state.activeUrl];
      if (urlViews) urlViews.forEach(el => { if (el) el.webview.src = val; });
      render();
    });

    $('refreshBtn').onclick = () => { if (refs.webview) refs.webview.reload(); };
    $('backBtn').onclick = () => { if (refs.webview) refs.webview.goBack(); };
    $('forwardBtn').onclick = () => { if (refs.webview) refs.webview.goForward(); };

    function updateNavButtons() {
      $('backBtn').disabled = !refs.webview || !refs.webview.canGoBack();
      $('forwardBtn').disabled = !refs.webview || !refs.webview.canGoForward();
    }

    const PADDING = 56;

    function fitZoom(v) {
      const aw = main.clientWidth - PADDING;
      const ah = main.clientHeight - PADDING;
      return Math.min(aw / v.width, ah / v.height, 1);
    }

    function applyZoom(zoom) {
      const v = state.views[state.active];
      if (!v || !refs.webview) return;
      refs.webview.style.transform = `scale(${zoom})`;
      refs.scaleWrap.style.width = Math.round(v.width * zoom) + 'px';
      refs.scaleWrap.style.height = Math.round(v.height * zoom) + 'px';
    }

    window.addEventListener('resize', () => {
      if (!isFullscreen && refs.webview) applyZoom(fitZoom(state.views[state.active]));
    });

    $('fullscreenBtn').onclick = () => enterFullscreen();

    // Bookmarks
    const DEFAULT_BOOKMARKS = [
      'http://localhost:3000',
      'https://dev-admin.finitypay.app/',
      'https://sta-admin.finitypay.app/',
    ];

    let bookmarks = (() => {
      try { return JSON.parse(localStorage.getItem('sv-bookmarks')) || null; } catch { return null; }
    })() || DEFAULT_BOOKMARKS;

    function saveBookmarks() { localStorage.setItem('sv-bookmarks', JSON.stringify(bookmarks)); }

    function renderBookmarks() {
      const list = $('bookmarkList');
      list.innerHTML = '';
      bookmarks.forEach((url, i) => {
        const row = document.createElement('div');
        row.className = 'bookmark-item';

        const lbl = document.createElement('span');
        lbl.className = 'bookmark-item-label';
        lbl.textContent = url;
        lbl.onclick = () => { loadUrl(url); closeBookmarks(); };

        const del = document.createElement('button');
        del.className = 'bookmark-del';
        del.textContent = '×';
        del.onclick = e => { e.stopPropagation(); bookmarks.splice(i, 1); saveBookmarks(); renderBookmarks(); };

        row.append(lbl, del);
        list.appendChild(row);
      });
    }

    function loadUrl(url) {
      if (!state.urls[state.activeUrl]s.length) { state.urls.push(url); state.activeUrl = 0; }
      else { state.urls[state.activeUrl] = url; }
      urlInput.value = url;
      const urlViews = viewEls[state.activeUrl];
      if (urlViews) urlViews.forEach(el => { if (el) el.webview.src = url; });
      save();
      render();
    }

    function closeBookmarks() { $('bookmarkWrap').classList.remove('open'); }

    $('bookmarkBtn').onclick = e => { e.stopPropagation(); $('bookmarkWrap').classList.toggle('open'); renderBookmarks(); };

    $('bookmarkSaveBtn').onclick = () => {
      const val = $('bookmarkInput').value.trim() || state.urls[state.activeUrl] || '';
      if (!val) return;
      const url = /^https?:\/\//i.test(val) ? val : 'https://' + val;
      if (!bookmarks.includes(url)) { bookmarks.push(url); saveBookmarks(); renderBookmarks(); }
      $('bookmarkInput').value = '';
    };

    $('bookmarkInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('bookmarkSaveBtn').click(); });

    document.addEventListener('click', e => {
      if (!$('bookmarkWrap').contains(e.target)) closeBookmarks();
    });

    renderBookmarks();

    // Add screen modal
    addTabBtn.onclick = () => {
      mName.value = ''; mWidth.value = ''; mHeight.value = '';
      overlay.classList.remove('hidden');
      mName.focus();
    };

    $('cancelBtn').onclick = () => overlay.classList.add('hidden');

    overlay.onclick = e => { if (e.target === overlay) overlay.classList.add('hidden'); };

    function confirmAdd() {
      const name = mName.value.trim();
      const w = parseInt(mWidth.value);
      const h = parseInt(mHeight.value);
      if (!name || !w || !h) return;
      state.views.push({ name, width: w, height: h });
      state.active = state.views.length - 1;
      save();
      render();
      overlay.classList.add('hidden');
    }

    $('confirmBtn').onclick = confirmAdd;
    [mName, mWidth, mHeight].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') confirmAdd(); }));

    let isFullscreen = false;

    function applyFullscreenScale(v) {
      if (!refs.webview || !refs.scaleWrap) return;
      const scale = Math.min(window.innerWidth / v.width, window.innerHeight / v.height);
      refs.webview.style.transform = `scale(${scale})`;
      refs.scaleWrap.style.width = Math.round(v.width * scale) + 'px';
      refs.scaleWrap.style.height = Math.round(v.height * scale) + 'px';
    }

    function enterFullscreen() {
      const v = state.views[state.active];
      if (!v || !refs.webview) return;
      isFullscreen = true;
      document.body.classList.add('app-fullscreen');
      if (window.electronAPI) window.electronAPI.setFullScreen(true);
      setTimeout(() => applyFullscreenScale(v), 100);
    }

    function exitFullscreen() {
      const v = state.views[state.active];
      isFullscreen = false;
      document.body.classList.remove('app-fullscreen');
      if (window.electronAPI) window.electronAPI.setFullScreen(false);
      if (refs.webview && v) applyZoom(fitZoom(v));
    }

    function handleKey(key) {
      if (key === 'Escape') { exitFullscreen(); return; }
      if (key === 'ArrowRight') switchScreen(state.active + 1);
      else if (key === 'ArrowLeft') switchScreen(state.active - 1);
    }

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      handleKey(e.key);
    });

    if (window.electronAPI) window.electronAPI.onKey(handleKey);

    // Inspect
    let inspecting = false;
    let panelCollapsed = false;
    const inspectPanel = $('inspectPanel');
    const inspectTagLabel = $('inspectTagLabel');
    const inspectCollapseIcon = $('inspectCollapseIcon');
    const inspectFields = $('inspectFields');

    $('inspectCollapseBtn').onclick = () => {
      panelCollapsed = !panelCollapsed;
      inspectPanel.classList.toggle('panel-collapsed', panelCollapsed);
      inspectCollapseIcon.style.transform = panelCollapsed ? 'rotate(180deg)' : '';
    };
    const iFieldText = $('iFieldText');
    const iFieldFontSize = $('iFieldFontSize');
    const iFieldFontWeight = $('iFieldFontWeight');
    const iFieldLineHeight = $('iFieldLineHeight');
    const iFieldLetterSpacing = $('iFieldLetterSpacing');
    const iFieldFontFamily = $('iFieldFontFamily');
    const iFieldColor = $('iFieldColor');
    const iFieldBg = $('iFieldBg');
    const iFieldOpacity = $('iFieldOpacity');
    const iFieldBorderRadius = $('iFieldBorderRadius');
    const iFieldMarTop = $('iFieldMarTop');
    const iFieldMarRight = $('iFieldMarRight');
    const iFieldMarBottom = $('iFieldMarBottom');
    const iFieldMarLeft = $('iFieldMarLeft');
    const iFieldWidth = $('iFieldWidth');
    const iFieldHeight = $('iFieldHeight');
    const iFieldPadTop = $('iFieldPadTop');
    const iFieldPadRight = $('iFieldPadRight');
    const iFieldPadBottom = $('iFieldPadBottom');
    const iFieldPadLeft = $('iFieldPadLeft');

    const INJECT_INSPECTOR = `(function() {
      if (window.__svInspectCleanup) window.__svInspectCleanup();
      const hl = document.createElement('div');
      hl.style.cssText = 'position:fixed;pointer-events:none;border:2px solid #4a9eff;background:rgba(74,158,255,0.07);z-index:2147483647;box-sizing:border-box;';
      document.body.appendChild(hl);
      let locked = false;
      function onOver(e) {
        if (locked) return;
        const tag = e.target.tagName;
        if (tag === 'BODY' || tag === 'HTML') return;
        const r = e.target.getBoundingClientRect();
        hl.style.top = r.top+'px'; hl.style.left = r.left+'px';
        hl.style.width = r.width+'px'; hl.style.height = r.height+'px';
      }
      function onClick(e) {
        e.preventDefault(); e.stopPropagation();
        const el = e.target;
        if (el.tagName === 'BODY' || el.tagName === 'HTML') return;
        locked = true;
        window.__svLastEl = el;
        const cs = window.getComputedStyle(el);
        const r = el.getBoundingClientRect();
        const data = {
          type: 'inspect',
          tag: el.tagName.toLowerCase(),
          text: el.innerText.slice(0, 120),
          fontSize: cs.fontSize, fontWeight: cs.fontWeight,
          lineHeight: cs.lineHeight, letterSpacing: cs.letterSpacing,
          fontFamily: cs.fontFamily.split(',')[0].trim().replace(/['"]/g, ''),
          color: cs.color, backgroundColor: cs.backgroundColor, opacity: cs.opacity,
          borderRadius: cs.borderRadius,
          width: Math.round(r.width) + 'px', height: Math.round(r.height) + 'px',
          paddingTop: cs.paddingTop, paddingRight: cs.paddingRight,
          paddingBottom: cs.paddingBottom, paddingLeft: cs.paddingLeft,
          marginTop: cs.marginTop, marginRight: cs.marginRight,
          marginBottom: cs.marginBottom, marginLeft: cs.marginLeft,
        };
        console.log('__sv__' + JSON.stringify(data));
      }
      document.addEventListener('mouseover', onOver, true);
      document.addEventListener('click', onClick, true);
      window.__svInspectCleanup = () => {
        document.removeEventListener('mouseover', onOver, true);
        document.removeEventListener('click', onClick, true);
        hl.remove(); delete window.__svInspectCleanup;
      };
    })()`;

    const CLEANUP_INSPECTOR = `if (window.__svInspectCleanup) window.__svInspectCleanup()`;

    function onConsoleMessage(e) {
      if (!e.message.startsWith('__sv__')) return;
      const data = JSON.parse(e.message.slice(6));
      if (data.type !== 'inspect') return;
      const CONTAINER_TAGS = new Set(['div','section','article','main','nav','header','footer','aside','ul','ol','li','form','table','tbody','tr','td','th']);
      const isContainer = CONTAINER_TAGS.has(data.tag) || data.text.length > 50;
      iFieldText.closest('.inspect-field').style.display = isContainer ? 'none' : '';
      inspectTagLabel.textContent = '<' + data.tag + '>';
      iFieldText.value = isContainer ? '' : data.text;

      const isZero = v => !v || v === '0' || v === 'normal' || v === '0px';
      $('iSectionLetterSpacing').style.display = isZero(data.letterSpacing) ? 'none' : '';
      $('iSectionBg').style.display = !rgbToHex(data.backgroundColor) ? 'none' : '';
      $('iSectionBorderRadius').style.display = isZero(data.borderRadius) ? 'none' : '';
      $('iSectionPad').style.display = [data.paddingTop, data.paddingRight, data.paddingBottom, data.paddingLeft].every(isZero) ? 'none' : '';
      $('iSectionMar').style.display = [data.marginTop, data.marginRight, data.marginBottom, data.marginLeft].every(isZero) ? 'none' : '';
      iFieldFontSize.value = stripPx(data.fontSize);
      iFieldFontWeight.value = data.fontWeight;
      iFieldLineHeight.value = stripPx(data.lineHeight);
      iFieldLetterSpacing.value = stripPx(data.letterSpacing);
      iFieldFontFamily.value = data.fontFamily;
      iFieldColor.value = rgbToHex(data.color);
      iFieldBg.value = rgbToHex(data.backgroundColor);
      iFieldOpacity.value = data.opacity;
      iFieldBorderRadius.value = stripPx(data.borderRadius);
      iFieldWidth.value = stripPx(data.width);
      iFieldHeight.value = stripPx(data.height);
      iFieldPadTop.value = stripPx(data.paddingTop);
      iFieldPadRight.value = stripPx(data.paddingRight);
      iFieldPadBottom.value = stripPx(data.paddingBottom);
      iFieldPadLeft.value = stripPx(data.paddingLeft);
      iFieldMarTop.value = stripPx(data.marginTop);
      iFieldMarRight.value = stripPx(data.marginRight);
      iFieldMarBottom.value = stripPx(data.marginBottom);
      iFieldMarLeft.value = stripPx(data.marginLeft);
    }

    function toggleInspect() {
      inspecting = !inspecting;
      $('inspectBtn').classList.toggle('active', inspecting);
      $('fsInspectBtn').classList.toggle('active', inspecting);
      if (inspecting) {
        inspectPanel.classList.add('visible');
        inspectToggle.classList.add('on');
        if (refs.webview) {
          refs.webview.executeJavaScript(INJECT_INSPECTOR);
          refs.webview.addEventListener('console-message', onConsoleMessage);
        }
      } else {
        inspectPanel.classList.remove('visible');
        inspectPanel.classList.remove('panel-collapsed');
        panelCollapsed = false;
        inspectCollapseIcon.style.transform = '';
        inspectTagLabel.textContent = 'Click an element';
        inspectToggle.classList.remove('on');
        if (refs.webview) {
          refs.webview.executeJavaScript(CLEANUP_INSPECTOR);
          refs.webview.removeEventListener('console-message', onConsoleMessage);
        }
      }
    }

    function normDim(v) { return /^\d+(\.\d+)?$/.test(v) ? v + 'px' : v; }
    function normColor(v) { return /^[0-9a-fA-F]{3,6}$/.test(v) ? '#' + v : v; }
    function stripPx(v) { return v ? v.replace(/px$/, '') : v; }

    function rgbToHex(rgb) {
      const m = rgb.match(/[\d.]+/g);
      if (!m || m.length < 3) return '';
      if (m.length >= 4 && parseFloat(m[3]) === 0) return '';
      return '#' + m.slice(0,3).map(n => parseInt(n).toString(16).padStart(2,'0')).join('');
    }

    function applyProp(prop, value) {
      if (!refs.webview || !value) return;
      refs.webview.executeJavaScript(`if (window.__svLastEl) window.__svLastEl.style.setProperty('${prop}', '${value}', 'important')`);
    }

    iFieldText.addEventListener('input', () => {
      if (!refs.webview) return;
      refs.webview.executeJavaScript(`if (window.__svLastEl) window.__svLastEl.innerText = ${JSON.stringify(iFieldText.value)}`);
    });
    iFieldFontSize.addEventListener('input', () => applyProp('font-size', normDim(iFieldFontSize.value.trim())));
    iFieldFontWeight.addEventListener('input', () => applyProp('font-weight', iFieldFontWeight.value.trim()));
    iFieldLineHeight.addEventListener('input', () => applyProp('line-height', normDim(iFieldLineHeight.value.trim())));
    iFieldLetterSpacing.addEventListener('input', () => applyProp('letter-spacing', normDim(iFieldLetterSpacing.value.trim())));
    iFieldFontFamily.addEventListener('input', () => applyProp('font-family', iFieldFontFamily.value.trim()));
    iFieldColor.addEventListener('input', () => applyProp('color', normColor(iFieldColor.value.trim())));
    iFieldBg.addEventListener('input', () => applyProp('background-color', normColor(iFieldBg.value.trim())));
    iFieldOpacity.addEventListener('input', () => applyProp('opacity', iFieldOpacity.value.trim()));
    iFieldBorderRadius.addEventListener('input', () => applyProp('border-radius', normDim(iFieldBorderRadius.value.trim())));
    iFieldWidth.addEventListener('input', () => applyProp('width', normDim(iFieldWidth.value.trim())));
    iFieldHeight.addEventListener('input', () => applyProp('height', normDim(iFieldHeight.value.trim())));
    iFieldPadTop.addEventListener('input', () => applyProp('padding-top', normDim(iFieldPadTop.value.trim())));
    iFieldPadRight.addEventListener('input', () => applyProp('padding-right', normDim(iFieldPadRight.value.trim())));
    iFieldPadBottom.addEventListener('input', () => applyProp('padding-bottom', normDim(iFieldPadBottom.value.trim())));
    iFieldPadLeft.addEventListener('input', () => applyProp('padding-left', normDim(iFieldPadLeft.value.trim())));
    iFieldMarTop.addEventListener('input', () => applyProp('margin-top', normDim(iFieldMarTop.value.trim())));
    iFieldMarRight.addEventListener('input', () => applyProp('margin-right', normDim(iFieldMarRight.value.trim())));
    iFieldMarBottom.addEventListener('input', () => applyProp('margin-bottom', normDim(iFieldMarBottom.value.trim())));
    iFieldMarLeft.addEventListener('input', () => applyProp('margin-left', normDim(iFieldMarLeft.value.trim())));

    $('inspectBtn').onclick = toggleInspect;

    const inspectToggle = $('inspectToggle');
    inspectToggle.onclick = () => {
      const active = inspectToggle.classList.toggle('on');
      if (active) {
        if (refs.webview) refs.webview.executeJavaScript(INJECT_INSPECTOR);
      } else {
        if (refs.webview) refs.webview.executeJavaScript(CLEANUP_INSPECTOR);
      }
    };

    $('screenshotBtn').onclick = () => {
      if (!refs.webview || !state.urls[state.activeUrl]) return;
      if (window.electronAPI) window.electronAPI.takeScreenshot();
    };

    $('fsScreenshotBtn').onclick = () => {
      if (!refs.webview || !state.urls[state.activeUrl]) return;
      if (window.electronAPI) window.electronAPI.takeScreenshotDesktop();
    };

    const fsHoverZone = $('fsHoverZone');
    const fsActions = $('fsActions');
    fsHoverZone.addEventListener('mouseenter', () => fsActions.classList.add('fs-visible'));
    fsHoverZone.addEventListener('mouseleave', () => fsActions.classList.remove('fs-visible'));
    fsActions.addEventListener('mouseenter', () => fsActions.classList.add('fs-visible'));
    fsActions.addEventListener('mouseleave', () => fsActions.classList.remove('fs-visible'));

    $('fsInspectBtn').onclick = toggleInspect;

    const titleWrap = $('titleWrap');
    $('titleCaretBtn').onclick = e => { e.stopPropagation(); titleWrap.classList.toggle('open'); };
    document.addEventListener('click', e => { if (!titleWrap.contains(e.target)) titleWrap.classList.remove('open'); });

    const updateOverlay = $('updateOverlay');
    const updateModalIcon = $('updateModalIcon');
    const updateModalTitle = $('updateModalTitle');
    const updateModalSub = $('updateModalSub');
    const updateModalInstall = $('updateModalInstall');
    const updateModalClose = $('updateModalClose');

    function showUpdateModal(icon, title, sub, { closeable = false, installable = false } = {}) {
      updateModalIcon.textContent = icon;
      updateModalTitle.textContent = title;
      updateModalSub.textContent = sub;
      updateModalInstall.classList.toggle('hidden', !installable);
      updateModalClose.classList.toggle('hidden', !closeable);
      updateOverlay.classList.remove('hidden');
    }

    updateModalClose.onclick = () => updateOverlay.classList.add('hidden');
    updateModalInstall.onclick = () => {
      if (window.electronAPI) window.electronAPI.installUpdate();
    };

    const releaseBtn = $('releaseBtn');
    releaseBtn.onclick = () => {
      if (!window.electronAPI) return;
      titleWrap.classList.remove('open');
      showUpdateModal('⏳', 'Checking for updates…', 'Looking for a new version');
      window.electronAPI.checkForUpdates();
    };
    if (window.electronAPI) {
      window.electronAPI.onUpdateAvailable((version) => {
        showUpdateModal('⬇️', `Downloading v${version}…`, '0%');
      });
      window.electronAPI.onUpdateProgress((pct) => {
        updateModalSub.textContent = pct + '%';
      });
      window.electronAPI.onUpdateDownloaded(() => {
        showUpdateModal('✅', 'Update ready', 'Restart to apply the new version.', { closeable: true, installable: true });
      });
      window.electronAPI.onUpdateNotAvailable(() => {
        window.electronAPI.getVersion().then(v => {
          showUpdateModal('✅', 'Up to date', `You are on the latest version (v${v}).`, { closeable: true });
        });
      });
      window.electronAPI.onUpdateError((msg) => {
        showUpdateModal('❌', 'Update failed', msg, { closeable: true });
      });
    }

    render();
  </script>
</body>
</html>
