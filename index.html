<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Screen Viewer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='3' width='20' height='13' rx='2'/><path d='M1 21h22'/><path d='M8 21l1-5h6l1 5'/></svg>" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: rgb(83, 83, 83);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: #000;
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #555;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .header-title svg {
      flex-shrink: 0;
      opacity: 0.6;
    }

    .url-input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 580px;
      margin: 0 auto;
    }

    .url-input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      height: 40px;
      padding: 0 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    .url-input:focus { border-color: #555; }
    .url-input::placeholder { color: #444; }

    .header-btn {
      height: 30px;
      padding: 0 10px;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 6px;
      color: #888;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.1s;
    }

    .header-btn:hover { background: #2a2a2a; color: #ccc; border-color: #444; }

    /* Tabs */
    .tabs-bar {
      background: #111;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      padding: 0 8px;
      height: 46px;
      flex-shrink: 0;
      gap: 3px;
      overflow-x: auto;
    }

    .tabs-bar::-webkit-scrollbar { height: 2px; }
    .tabs-bar::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px 0 10px;
      height: 32px;
      border-radius: 5px;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid transparent;
      font-size: 14px;
      color: #666;
      transition: all 0.1s;
      flex-shrink: 0;
      user-select: none;
    }

    .tab:hover { background: #1e1e1e; color: #aaa; }

    .tab.active {
      background: #2a2a2a;
      border-color: #363636;
      color: #fff;
    }

    .tab-name { font-weight: 500; }
    .tab-dims { color: #444; font-size: 11px; }
    .tab.active .tab-dims { color: #555; }

    .tab-close {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: none;
      background: transparent;
      color: #444;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      padding: 0;
      line-height: 1;
      transition: all 0.1s;
    }

    .tab-close:hover { background: #444; color: #fff; }

    .tab-add {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 5px;
      border: 1px dashed #2e2e2e;
      background: transparent;
      color: #444;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      transition: all 0.1s;
      flex-shrink: 0;
    }

    .tab-add:hover { border-color: #555; color: #aaa; background: #1e1e1e; }

    /* Main */
    .main {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 28px 24px;
    }

    .view-wrap {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
    }

    .view-label {
      color: #999;
      font-size: 11px;
      margin-bottom: 10px;
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    .view-frame {
      display: block;
      position: relative;
      box-shadow: 0 4px 30px rgba(0,0,0,0.7);
    }

    .click-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      cursor: zoom-in;
    }

    :fullscreen .click-overlay,
    :-webkit-full-screen .click-overlay { display: none; }

    .nav-arrow {
      display: none;
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 50%;
      color: #fff;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      z-index: 100;
      transition: background 0.15s;
      user-select: none;
    }

    .nav-arrow:hover { background: rgba(255,255,255,0.22); }
    :fullscreen .nav-arrow,
    :-webkit-full-screen .nav-arrow { display: flex; }
    .nav-prev { left: 20px; }
    .nav-next { right: 20px; }

    .view-frame svg { display: block; }

    .view-frame iframe { display: block; border: none; }

    :fullscreen,
    :-webkit-full-screen {
      background: #000;
      display: flex !important;
      align-items: center;
      justify-content: center;
    }


    /* Zoom */
    .zoom-card {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: rgba(15,15,15,0.88);
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 9px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(8px);
    }

    .zoom-label { color: #666; font-size: 11px; }
    .zoom-val { color: #888; font-size: 11px; width: 34px; text-align: right; }

    input[type="range"] {
      width: 100px;
      accent-color: #888;
      cursor: pointer;
    }

    /* Empty */
    .empty {
      color: #555;
      font-size: 13px;
      text-align: center;
      padding-top: 80px;
      line-height: 1.8;
    }

    /* Modal */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .overlay.hidden { display: none; }

    .modal {
      background: #161616;
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      padding: 20px;
      width: 268px;
    }

    .modal h3 {
      color: #eee;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .field { margin-bottom: 12px; }

    .field label {
      display: block;
      color: #666;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      background: #0e0e0e;
      border: 1px solid #2e2e2e;
      border-radius: 5px;
      color: #eee;
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.1s;
    }

    .field input:focus { border-color: #484848; }

    .field-row { display: flex; gap: 8px; }
    .field-row .field { flex: 1; }

    .modal-actions { display: flex; gap: 8px; margin-top: 16px; }

    .btn {
      flex: 1;
      padding: 8px;
      border-radius: 5px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.1s;
    }

    .btn:hover { opacity: 0.8; }
    .btn-primary { background: #fff; color: #000; }
    .btn-secondary { background: #222; color: #888; border: 1px solid #2e2e2e; }
  </style>
</head>
<body>

  <div class="header">
    <span class="header-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="13" rx="2"/>
        <path d="M1 21h22"/>
        <path d="M8 21l1-5h6l1 5"/>
      </svg>
      Screen Viewer
    </span>
    <div class="url-input-wrap">
      <input class="url-input" id="urlInput" type="text" placeholder="http://localhost:3000" spellcheck="false" autocomplete="off" />
      <button class="header-btn" id="refreshBtn">Refresh</button>
    </div>
  </div>

  <div class="tabs-bar" id="tabsBar">
    <button class="tab-add" id="addTabBtn" title="Add screen">+</button>
  </div>

  <div class="main" id="main"></div>

  <div class="zoom-card">
    <span class="zoom-label">Zoom</span>
    <input type="range" id="zoomSlider" min="0.1" max="1" step="0.05" value="0.5" />
    <span class="zoom-val" id="zoomVal">50%</span>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="modal">
      <h3>Add Screen</h3>
      <div class="field">
        <label>Name</label>
        <input id="mName" type="text" placeholder="e.g. FHD" />
      </div>
      <div class="field-row">
        <div class="field">
          <label>Width</label>
          <input id="mWidth" type="number" placeholder="1920" />
        </div>
        <div class="field">
          <label>Height</label>
          <input id="mHeight" type="number" placeholder="1080" />
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" id="confirmBtn">Add</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULTS = [
      { name: 'FHD', width: 1920, height: 1080 },
      { name: 'HD', width: 1366, height: 768 },
      { name: 'MacBook Air', width: 1280, height: 800 },
      { name: 'MacBook 14"', width: 1440, height: 900 },
    ];

    let refs = {};

    let state = (() => {
      try { return JSON.parse(localStorage.getItem('sv')) || null; } catch { return null; }
    })() || { url: '', zoom: 0.5, active: 0, views: DEFAULTS };

    const $ = id => document.getElementById(id);
    const urlInput = $('urlInput');
    const tabsBar = $('tabsBar');
    const addTabBtn = $('addTabBtn');
    const main = $('main');
    const zoomSlider = $('zoomSlider');
    const zoomVal = $('zoomVal');
    const overlay = $('overlay');
    const mName = $('mName');
    const mWidth = $('mWidth');
    const mHeight = $('mHeight');

    urlInput.value = state.url;
    zoomSlider.value = state.zoom;
    zoomVal.textContent = Math.round(state.zoom * 100) + '%';

    function save() {
      localStorage.setItem('sv', JSON.stringify(state));
    }

    function render() {
      renderTabs();
      renderView();
    }

    function renderTabs() {
      tabsBar.querySelectorAll('.tab').forEach(t => t.remove());
      state.views.forEach((v, i) => {
        const tab = document.createElement('div');
        tab.className = 'tab' + (i === state.active ? ' active' : '');

        const name = document.createElement('span');
        name.className = 'tab-name';
        name.textContent = v.name;

        const dims = document.createElement('span');
        dims.className = 'tab-dims';
        dims.textContent = v.width + 'x' + v.height;

        const close = document.createElement('button');
        close.className = 'tab-close';
        close.textContent = '×';
        close.onclick = e => { e.stopPropagation(); removeView(i); };

        tab.append(name, dims, close);
        tab.onclick = () => { state.active = i; save(); render(); };
        tabsBar.insertBefore(tab, addTabBtn);
      });
    }

    function renderView() {
      main.innerHTML = '';

      if (!state.url) {
        main.innerHTML = '<div class="empty">Enter a URL above and press Enter</div>';
        return;
      }

      if (!state.views.length) {
        main.innerHTML = '<div class="empty">No screens. Click + to add one.</div>';
        return;
      }

      const v = state.views[state.active];
      if (!v) return;

      const w = v.width * state.zoom;
      const h = v.height * state.zoom;

      const wrap = document.createElement('div');
      wrap.className = 'view-wrap';

      const label = document.createElement('div');
      label.className = 'view-label';
      label.textContent = v.name + ' ' + v.width + 'x' + v.height;

      const frame = document.createElement('div');
      frame.className = 'view-frame';

      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', `0 0 ${v.width} ${v.height}`);
      svg.setAttribute('width', w);
      svg.setAttribute('height', h);

      const fo = document.createElementNS('http://www.w3.org/2000/svg', 'foreignObject');
      fo.setAttribute('width', v.width);
      fo.setAttribute('height', v.height);
      fo.setAttribute('x', '0');
      fo.setAttribute('y', '0');

      const iframe = document.createElement('iframe');
      iframe.src = state.url;
      iframe.width = v.width;
      iframe.height = v.height;

      fo.appendChild(iframe);
      svg.appendChild(fo);
      frame.appendChild(svg);

      refs = { svg, fo, iframe, label };

      const clickOverlay = document.createElement('div');
      clickOverlay.className = 'click-overlay';
      clickOverlay.onclick = () => {
        if (frame.requestFullscreen) frame.requestFullscreen();
        else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
      };
      frame.appendChild(clickOverlay);

      const prevBtn = document.createElement('button');
      prevBtn.className = 'nav-arrow nav-prev';
      prevBtn.innerHTML = '&#8249;';
      prevBtn.onclick = () => switchScreen(state.active - 1);

      const nextBtn = document.createElement('button');
      nextBtn.className = 'nav-arrow nav-next';
      nextBtn.innerHTML = '&#8250;';
      nextBtn.onclick = () => switchScreen(state.active + 1);

      frame.append(prevBtn, nextBtn);
      wrap.append(label, frame);
      main.appendChild(wrap);
    }

    function switchScreen(i) {
      if (i < 0 || i >= state.views.length) return;
      state.active = i;
      save();
      renderTabs();
      const v = state.views[i];
      if (!v || !refs.svg) { renderView(); return; }
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        refs.svg.setAttribute('viewBox', `0 0 ${v.width} ${v.height}`);
        refs.fo.setAttribute('width', v.width);
        refs.fo.setAttribute('height', v.height);
        refs.iframe.width = v.width;
        refs.iframe.height = v.height;
        const scale = Math.min(window.screen.width / v.width, window.screen.height / v.height);
        refs.svg.setAttribute('width', Math.round(v.width * scale));
        refs.svg.setAttribute('height', Math.round(v.height * scale));
        if (refs.label) refs.label.textContent = v.name + ' ' + v.width + 'x' + v.height;
      } else {
        renderView();
      }
    }

    function removeView(i) {
      state.views.splice(i, 1);
      if (state.active >= state.views.length) state.active = Math.max(0, state.views.length - 1);
      save();
      render();
    }

    // URL
    urlInput.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      let val = urlInput.value.trim();
      if (val && !/^https?:\/\//i.test(val)) val = 'http://' + val;
      state.url = val;
      urlInput.value = val;
      save();
      render();
    });

    $('refreshBtn').onclick = () => {
      const frame = main.querySelector('iframe');
      if (frame) frame.src = frame.src;
    };

    // Zoom
    zoomSlider.addEventListener('input', () => {
      state.zoom = parseFloat(zoomSlider.value);
      zoomVal.textContent = Math.round(state.zoom * 100) + '%';
      save();
      render();
    });

    // Add screen modal
    addTabBtn.onclick = () => {
      mName.value = ''; mWidth.value = ''; mHeight.value = '';
      overlay.classList.remove('hidden');
      mName.focus();
    };

    $('cancelBtn').onclick = () => overlay.classList.add('hidden');

    overlay.onclick = e => { if (e.target === overlay) overlay.classList.add('hidden'); };

    function confirmAdd() {
      const name = mName.value.trim();
      const w = parseInt(mWidth.value);
      const h = parseInt(mHeight.value);
      if (!name || !w || !h) return;
      state.views.push({ name, width: w, height: h });
      state.active = state.views.length - 1;
      save();
      render();
      overlay.classList.add('hidden');
    }

    $('confirmBtn').onclick = confirmAdd;
    [mName, mWidth, mHeight].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') confirmAdd(); }));

    // Fullscreen: resize SVG to fill screen, restore on exit
    function onFullscreenChange() {
      if (!refs.svg) return;
      const v = state.views[state.active];
      if (!v) return;
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        const scale = Math.min(window.screen.width / v.width, window.screen.height / v.height);
        refs.svg.setAttribute('width', Math.round(v.width * scale));
        refs.svg.setAttribute('height', Math.round(v.height * scale));
      } else {
        refs.svg.setAttribute('width', Math.round(v.width * state.zoom));
        refs.svg.setAttribute('height', Math.round(v.height * state.zoom));
      }
    }
    document.addEventListener('fullscreenchange', onFullscreenChange);
    document.addEventListener('webkitfullscreenchange', onFullscreenChange);

    // Keyboard: left/right arrow to switch screens
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight') switchScreen(state.active + 1);
      else if (e.key === 'ArrowLeft') switchScreen(state.active - 1);
    });

    render();
  </script>
</body>
</html>
